    if (type === "boolean") return true;
    if (type === "integer" || type === "number") return 1;
    if (type === "null") return null;
    if (/phone|mobile|tel/i.test(key)) return "000-0000-0000";
    if (/email/i.test(key)) return "demo@example.com";

    if (signal?.aborted) throw new DOMException("\u5DF2\u53D6\u6D88\u6F14\u793A\u8BF7\u6C42", "AbortError");

        { error: { message: "\u6F14\u793A\u8BF7\u6C42\u9700\u8981 JSON \u5BF9\u8C61" } },
        400
      );
    }
    const messages = Array.isArray(body.messages) ? body.messages : [];
    let reply = mockReply(messages);
    if (body.response_format?.type === "json_object") {

        (message) => message.role === "system"

        reply = JSON.stringify(
          sample(JSON.parse(text.slice(text.indexOf("{"))))
        );
      } catch {
        reply = JSON.stringify({ notice: "\u6F14\u793A\u6570\u636E\uFF0C\u4E0D\u4F1A\u8C03\u7528\u771F\u5B9E\u6A21\u578B" });
      }
    }

        choices: [
          {
            index: 0,

      if (abort) signal?.removeEventListener("abort", abort);
    };

      start(controller) {
        let offset = 0;
        abort = () => {

          controller.error(new DOMException("\u5DF2\u53D6\u6D88\u6F14\u793A\u8BF7\u6C42", "AbortError"));
        };
        signal?.addEventListener("abort", abort, { once: true });

          if (offset >= reply.length) {
            controller.enqueue(encoder.encode("data: [DONE]\n\n"));
            cleanup();
            controller.close();
            return;
          }

            encoder.encode(
              `data: ${JSON.stringify({
                choices: [
                  {
                    index: 0,
                    delta: { content: reply.slice(offset, offset + 24) }
                  }
                ]

`
